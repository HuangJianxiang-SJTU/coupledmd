worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;

    # Compress JSON, SVG, and common text assets.
    gzip_types application/json application/javascript text/css text/xml image/svg+xml;

    # Hide nginx version.
    server_tokens off;

    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- Rate limiting ----
    # 10 requests/second per IP, burst of 20, with delayed excess.
    # XTC files are ~15 MB so the burst accommodates a few concurrent downloads.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ---- HTTP: Let's Encrypt ACME challenge + HTTPS redirect ----
    # The .well-known/acme-challenge/ path is served over plain HTTP so the
    # HTTP-01 validation works (Let's Encrypt does NOT follow redirects to
    # HTTPS). webroot is /usr/share/nginx/html -> ./frontend/dist on the host,
    # and certbot writes into <webroot>/.well-known/acme-challenge/.
    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS server ----
    server {
        listen 443 ssl;
        server_name _;

        # SSL certificates — mount or copy to these paths.
        # For Let's Encrypt: /etc/letsencrypt/live/<domain>/fullchain.pem
        # For self-signed:   generate with `openssl req -x509 ...`
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern TLS configuration (Mozilla Intermediate)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling (uncomment when using Let's Encrypt)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # Security headers.
        add_header X-Content-Type-Options  nosniff  always;
        add_header X-Frame-Options         DENY    always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ---- Frontend static files ----
        root /usr/share/nginx/html;
        index index.html;

        # Static assets with long cache (Vite hashes filenames).
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API reverse-proxy to the FastAPI container.
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # XTC files can be ~15 MB; allow plenty of time.
            proxy_read_timeout 120s;
            proxy_buffering    off;
        }

        # SPA fallback — all non-API, non-asset paths serve index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
